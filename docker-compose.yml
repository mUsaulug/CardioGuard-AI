version: "3.8"
services:
  cardioguard:
    build: .
    container_name: cardioguard-ai
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - ENABLE_DEBUG_ENDPOINTS=0
      # LLM proxy (R3-05): set on host or .env — never commit real keys
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ALLOW_CLIENT_LLM_KEY=${ALLOW_CLIENT_LLM_KEY:-0}
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
