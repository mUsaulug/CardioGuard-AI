version: "3.8"
services:
  cardioguard:
    build: .
    container_name: cardioguard-ai
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,*
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
